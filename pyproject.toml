[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinal-uncertainty"
version = "0.1.0"
description = "Experiment 0: ordinal uncertainty diagnostics for RetinaMNIST"
requires-python = ">=3.10"
dependencies = [
    "medmnist>=3.0.2",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
